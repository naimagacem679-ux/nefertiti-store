<style>
/* Layout: RTL storefront. Sticky header (brand, icons, search), section nav, hero with banner,

   Owner tools (edit mode, categories, products, delivery) show only for people who can edit this page. */
:root {
  --bg: #FBF6F4;
  --surface: #FFFFFF;
  --fg: #3A2A2E;

  --hero-b: #F6EBDD;
  --ok: #2F7D5B;
  --err: #B42318;
  --star: #C28A12;
  --tile-1: 90%;
  --tile-2: 82%;
  --font-display: "Reem Kufi", "Segoe UI", Tahoma, sans-serif;
  --font-latin: "Cormorant Garamond", Georgia, serif;
  --font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1C1517; --surface: #271D20; --fg: #F6EAEA; --muted: #BDA9AD; --line: #3F2F33;
    --accent: #E39AB0; --accent-fg: #2B1018; --soft: #33232A; --beige: #2D2420; --gold: #D7B46A;
    --hero-a: #3B2229; --hero-b: #2D2420; --ok: #6CCB9E; --err: #FF8A80; --star: #E8B84A;
    --tile-1: 26%; --tile-2: 20%; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1C1517; --surface: #271D20; --fg: #F6EAEA; --muted: #BDA9AD; --line: #3F2F33;
  --accent: #E39AB0; --accent-fg: #2B1018; --soft: #33232A; --beige: #2D2420; --gold: #D7B46A;
  --hero-a: #3B2229; --hero-b: #2D2420; --ok: #6CCB9E; --err: #FF8A80; --star: #E8B84A;
  --tile-1: 26%; --tile-2: 20%; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 400 15px/1.65 var(--font-body); direction: rtl;
  padding-left: max(16px, env(safe-area-inset-left, 0px));

}

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1080px; margin-inline: auto; }
.ltr { direction: ltr; unicode-bidi: plaintext; }

.secrow a { color: var(--accent); font-size: 14px; font-weight: 500; text-decoration: none; }
.secrow .en { font: 600 13px var(--font-latin); letter-spacing: .2em; color: var(--gold); text-transform: uppercase; display: block; }

/* header */

  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg);
  padding-block: 10px 10px; border-bottom: 1px solid var(--line); grid-template-columns: minmax(0, 1fr);
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 10px;

.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

.search { display: flex; gap: 8px; }

.sections { display: flex; gap: 8px; overflow-x: auto; padding-block: 12px 2px; scrollbar-width: none; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)); }

.sections a { flex: none; text-decoration: none; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 500; white-space: nowrap; }

/* hero */
.hero { margin-top: 14px; border-radius: 24px; background: linear-gradient(135deg, var(--hero-a), var(--hero-b)); padding: 22px 18px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-items: center; position: relative; overflow: hidden; }
@media (min-width: 720px) { .hero { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); padding: 30px 34px; } }

/* section tiles */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 720px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.tile { position: relative; border-radius: 20px; overflow: hidden; aspect-ratio: 4 / 3; max-width: 100%; display: grid; align-content: end; padding: 14px; text-decoration: none; color: var(--fg);
  background: linear-gradient(150deg, hsl(var(--h) 55% var(--tile-1)), hsl(calc(var(--h) + 24) 45% var(--tile-2))); border: 1px solid var(--line); }
.tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tile span { position: relative; background: color-mix(in srgb, var(--surface) 86%, transparent); border-radius: 12px; padding: 6px 12px; display: grid; }
.tile b { font: 700 17px/1.3 var(--font-display); }
.tile i { font: 600 11px/1.3 var(--font-latin); font-style: normal; letter-spacing: .22em; color: var(--gold); text-transform: uppercase; }

/* grid + card */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; } }
@media (min-width: 900px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; position: relative; }
.pic { aspect-ratio: 1 / 1; max-width: 100%; display: grid; place-items: center; text-align: center; padding: 12px; position: relative; text-decoration: none;
  background: linear-gradient(150deg, hsl(var(--h) 55% var(--tile-1)), hsl(calc(var(--h) + 24) 45% var(--tile-2))); }
.pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

.fav { position: absolute; top: 8px; inset-inline-end: 8px; width: 34px; height: 34px; border-radius: 50%; border: 0; background: color-mix(in srgb, var(--surface) 88%, transparent); display: grid; place-items: center; z-index: 2; }

.info { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }

.name { font-weight: 500; line-height: 1.45; text-align: right; overflow-wrap: anywhere; text-decoration: none; }

.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 6px; margin-top: auto; }
.price { font-weight: 600; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; line-height: 1.3; }

.add { border: 0; background: var(--accent); color: var(--accent-fg); border-radius: 999px; padding: 6px 14px; font-weight: 500; font-size: 14px; white-space: nowrap; }

.rt { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }

.empty { padding: 40px 0; text-align: center; color: var(--muted); }
.more { display: block; margin: 22px auto 0; }

/* catalogue */
.crumbs { display: flex; flex-wrap: wrap; gap: 4px 8px; margin: 18px 0 6px; font-size: 13px; color: var(--muted); }

.chipbar::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 14px; white-space: nowrap; text-decoration: none; }
.chip[aria-pressed="true"], .chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip.sub { background: var(--soft); border-color: transparent; }

.filters summary { cursor: pointer; padding: 10px 0; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
.filters summary::after { content: "+"; font-size: 18px; line-height: 1; }

/* product page */
.pp { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; margin-top: 8px; }

.gal .main { aspect-ratio: 1 / 1; border-radius: 20px; overflow: hidden; position: relative; display: grid; place-items: center; max-width: 100%;
  background: linear-gradient(150deg, hsl(var(--h) 55% var(--tile-1)), hsl(calc(var(--h) + 24) 45% var(--tile-2))); border: 1px solid var(--line); }

/* contact + footer */

/* bars */

.sh-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 8px; }

.line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.line .t { min-width: 0; font-weight: 500; overflow-wrap: anywhere; }
.line .t small { display: block; color: var(--muted); }
.line .p { font-variant-numeric: tabular-nums; font-weight: 600; }
.qty { display: inline-flex; align-items: center; gap: 4px; direction: ltr; }
.qty button { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); font-size: 16px; }
.qty output { min-width: 24px; text-align: center; font-variant-numeric: tabular-nums; }
.fs { margin: 0 0 12px; min-width: 0; }
label.f { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.in { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; font-size: 16px; }

    var re = /(<script[^>]*id="store-data"[^>]*>)([\s\S]*?)(<\/script>)/;
    if (!st || !re.test(PRISTINE) || PRISTINE.indexOf("<title>") < 0) return null;
    var json = JSON.stringify(S, function (k, v) { return k === "_d" ? undefined : v; }).replace(/</g, "\\u003c");
    var body = PRISTINE.replace(re, function (m, a, b, c) { return a + json + c; });
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + st.textContent + "</style></head><body>" + body + "</body></html>";
  }
  var saving = false;
  function saveAll() {
    if (saving) return;
    if (!artifactApi) { toast("الحفظ غير متاح هنا. افتحي الصفحة من حسابك."); return; }
    var doc = buildDoc(); if (!doc) { toast("تعذر تجهيز الصفحة للحفظ."); return; }
    saving = true; $("fab").textContent = "جار الحفظ...";
    artifactApi.publish(doc).then(function () { dirty = false; saving = false; }, function (e) {
      saving = false; $("fab").textContent = "حفظ ونشر التغييرات";
      toast(e && e.code === "conflict" ? "تم تعديل الصفحة من مكان آخر. أعيدي التحميل وكرري التعديل." : "تعذر الحفظ. تأكدي أن لديك صلاحية التعديل.");
    });
  }
  $("fab").addEventListener("click", saveAll);
  window.addEventListener("beforeunload", function (e) { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
  function updateFab() { var f = $("fab"); f.hidden = !(isOwner && dirty); f.classList.toggle("nobar", count() === 0); }

  /* ---------- page ---------- */
  function ownerPanel() {
    var demo = S.products.some(function (p) { return p.demo; }), out = S.products.filter(function (p) { return !inStock(p); }).length;
    var low = S.products.filter(function (p) { var s = totalStock(p); return s > 0 && s <= 3; });
    return h("section", { class: "owner" },
      h("h2", { text: "لوحة صاحبة المتجر (لا تظهر للزبائن)" }),
      h("p", { text: S.products.length + " منتج · " + out + " نفدت كميتها · " + listFor("offers").length + " في العروض · " + S.cats.length + " تصنيف" }),
      low.length ? h("p", { style: "color:var(--err)", text: "قاربت على النفاد: " + low.map(function (p) { return p.name + " (" + totalStock(p) + ")"; }).join("، ") }) : null,
      demo ? h("p", { text: "بعض المنتجات أمثلة تجريبية بأسعار تقريبية. عدّليها أو احذفيها قبل نشر الرابط." }) : null,
      h("div", { class: "tools" },
        h("button", { class: "btn" + (editMode ? " pri" : ""), type: "button", text: editMode ? "إيقاف وضع التعديل" : "تشغيل وضع التعديل", onclick: function () { editMode = !editMode; render(); } }),
        editMode ? [
          h("button", { class: "btn", type: "button", text: "＋ منتج جديد", onclick: function () { openProduct(null); } }),
          h("button", { class: "btn", type: "button", text: "الأقسام والتصنيفات والفلاتر", onclick: openCats }),
          h("button", { class: "btn", type: "button", text: "أسعار التوصيل", onclick: openShip }),
          h("button", { class: "btn", type: "button", text: "الاسم والشعار والصفحات", onclick: openSettings }),
          h("button", { class: "btn", type: "button", text: "روابط التواصل", onclick: openSocial }),
          demo ? h("button", { class: "btn danger", type: "button", text: "حذف كل المنتجات التجريبية", onclick: function () { S.products = S.products.filter(function (p) { return !p.demo; }); markDirty(); render(); } }) : null
        ] : null),
      editMode ? h("p", { text: "بعد التعديل اضغطي «حفظ ونشر التغييرات» ليراها الزبائن. الطلبات تصلك على واتساب فقط، ولا يتم إنقاص المخزون تلقائيا، عدّليه يدويا." }) : null);
  }
  function footer() {
    return h("footer", null, h("div", { class: "fn", text: S.store.name }), S.store.sub2 ? h("span", { text: S.store.sub2 }) : null,
      h("p", { class: "ls", text: "تابعينا وكوني دائماً قريبة من عالمنا ♡" }), socialBar(),
      h("div", { class: "flinks" }, h("a", { href: "#about", onclick: go("about"), text: "من نحن" }), h("a", { href: "#contact", onclick: go("contact"), text: "اتصلي بنا" }), h("a", { href: "#brands", onclick: go("brands"), text: "الماركات" })),
      h("span", { text: "© " + S.store.name }));
  }
  function render() {
    var main, v = view.t;
    if (v === "cat") main = catView(); else if (v === "brand") main = brandView(); else if (v === "prod") main = prodView();
    else if (v === "search") main = searchView(); else if (v === "list") main = listView(); else if (v === "favs") main = favsView();
    else if (v === "about") main = aboutView(); else if (v === "contact") main = contactView(); else if (v === "brands") main = brandsView(); else main = homeView();
    if (v !== "prod") { gal = 0; qty = 1; }
    var y = window.scrollY;
    $("app").replaceChildren.apply($("app"), [header(), sectionNav(), isOwner ? ownerPanel() : null].concat(view.t !== "home" ? [h("div", null, h("button", { class: "btn backbar", type: "button", onclick: back }, ico(CATSVG, "cat"), "رجوع خطوة"))] : [], main, [footer()]).filter(Boolean));
    document.title = S.store.name; updateBar(); window.scrollTo(0, y);
  }

  document.documentElement.lang = "ar"; document.documentElement.dir = "rtl";
  view = parse(location.hash); render();
  if (window.claude && window.claude.use) {
    Promise.all([window.claude.use("user"), window.claude.use("artifact")]).then(function (r) {
      var u = r[0]; artifactApi = r[1];
      isOwner = !!(u && artifactApi && ((u.canEdit && u.canEdit()) || (u.isOwner && u.isOwner())));
      if (isOwner) render();
    }, function () {});
  }
})();
</script>
